name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  build-cms:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms
    env:
      # next build needs the vars to exist; no live DB is contacted
      DATABASE_URL: postgres://user:pass@localhost:5432/cms
      PAYLOAD_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cms/package-lock.json
      - run: npm ci
      - run: npm run build
